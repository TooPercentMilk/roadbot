[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roadbot"
version = "0.1.0"
description = "Autonomous Ackermann-steering robot car software"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "PyYAML>=6.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
hardware = ["smbus2>=0.4"]
training = ["torch>=2.0"]
deployment = ["onnxruntime>=1.17"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
roadbot = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "hardware: requires physical Raspberry Pi hardware",
]

[tool.ruff]
line-length = 100
target-version = "py311"
